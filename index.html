<!doctype html>
<html lang="ko" translate="no" class="notranslate">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<meta name="theme-color" content="#ffffff">
<title>MOLIV 촬영 콜시트</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">

<body class="notranslate" translate="no">
<header class="top" id="top">
  <div class="wrap top-in">
    <div class="top-row">
      <span class="brand mono">MOLIV <span id="pcode"></span></span>
      <span class="total">촬영 진행률 <b class="mono" id="totalPct">0%</b></span>
    </div>
    <div class="tbar"><i id="totalBar"></i></div>
    <ol class="dots" id="dots"></ol>
  </div>
</header>

<main class="wrap" id="app">
  <section class="hero" id="overview"></section>
  <section class="block" id="outputs"></section>
  <section class="block" id="crew"></section>
  <section class="block" id="steps"></section>
  <section class="block" id="missing"></section>
  <footer class="foot" id="foot"></footer>
</main>

<div class="layer" id="layer" hidden></div>
<div class="toast" id="toast" hidden></div>
<input type="file" id="importFile" accept="application/json" hidden>

<script src="vendor/Sortable.min.js"></script>
